services:
  db:
    image: postgres:16
    container_name: dwh_postgres
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ./datasets:/data:ro
      - ./sql:/sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
